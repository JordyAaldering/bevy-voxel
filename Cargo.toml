[package]
name = "voxel"
version = "0.1.0"
edition = "2024"
default-run = "tutorial06"

[[bin]]
name = "tutorial01"
path = "src/tutorial01.rs"

[[bin]]
name = "tutorial02"
path = "src/tutorial02.rs"

[[bin]]
name = "tutorial03"
path = "src/tutorial03.rs"

[[bin]]
name = "tutorial04"
path = "src/tutorial04.rs"

[[bin]]
name = "tutorial05"
path = "src/tutorial05.rs"

[[bin]]
name = "tutorial06"
path = "src/tutorial06.rs"

[[bin]]
name = "tutorial07"
path = "src/tutorial07.rs"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[dependencies]
bevy = { version = "0.19", features = ["dynamic_linking"] }
bevy-inspector-egui = "0.37"
log = { version = "0.4", features = ["max_level_debug", "release_max_level_warn"] }
