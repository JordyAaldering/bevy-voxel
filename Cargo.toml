[package]
name = "voxel"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "main"
path = "src/guide11.rs"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
bevy = { version = "0.20.0", features = ["dynamic_linking"] }
bevy-inspector-egui = { git = "https://github.com/taboky-dev/bevy-inspector-egui.git", rev = "9a5b086" }
log = { version = "0.4.34", features = ["max_level_debug", "release_max_level_warn"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }

[dev-dependencies]
image = "0.25.10"
