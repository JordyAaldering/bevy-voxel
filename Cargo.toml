[package]
name = "voxel"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "guide09"
path = "src/guide09.rs"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[dependencies]
bevy = { version = "0.20.0", features = ["dynamic_linking"] }
bevy-inspector-egui = { git = "https://github.com/taboky-dev/bevy-inspector-egui.git", rev = "9a5b086" }
log = { version = "0.4.34", features = ["max_level_debug", "release_max_level_warn"] }
