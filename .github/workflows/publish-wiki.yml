
name: Publish wiki

# Only run when relevant files are changed
on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'docs/chapter*.md'
      - '.github/workflows/publish-wiki.yml'

# Cancel any in-progress workflows
concurrency:
  group: publish-wiki
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build wiki
        run: |
          mkdir wiki
          cp README.md wiki/Home.md
          for file in docs/chapter*.md; do
            # Extract name and chapter number from the file name
            name=$(basename "$file" .md)
            number=${name#chapter}
            # Extract the title from the first line of the file
            title=$(sed -n 's/^# //p' "$file" | head -n 1)
            title=${title:-$name}
            # Write all but the title to the page file
            page=${title// /-}
            sed '1{/^# /d;}' "$file" > "wiki/$page.md"
            # Append entry to the sidebar
            link=$(python3 -c 'import sys; from urllib.parse import quote; print(quote(sys.argv[1], safe="-._~"))' "$page")
            echo "${number}. [${title}]($link)" >> wiki/_Sidebar.md
          done
      - name: Publish wiki
        uses: Andrew-Chen-Wang/github-wiki-action@v5
        with:
          path: wiki
